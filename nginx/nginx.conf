events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

    # Upstream services
    upstream backend_api {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_ui {
        server frontend:3000;
        keepalive 32;
    }

    # HTTP server (or HTTPS termination in production with Certbot)
    server {
        listen 80;
        server_name _;

        # Health & SEO root endpoints
        location ~ ^/(health|docs|openapi.json|redoc|sitemap\.xml|robots\.txt) {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js static assets and build chunks
        location /_next {
            proxy_pass http://frontend_ui;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Dedicated Backend API routes (no corresponding frontend page route)
        location ~ ^/(api|system|analysis|enrichment|ai|opportunity|matching|media-plans|publisher-quality|competitive|scraper)(/|$) {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Shared routes: frontend pages exist at root/subpaths, backend APIs exist at JSON endpoints
        location ~ ^/(portal|companies|discovery|workflows|publishers|outreach|crm|sales-intelligence|analytics|jobs|google-drive|social-connections|admin)(/|$) {
            # 1. Next.js App Router RSC soft navigation
            if ($http_rsc = "1") {
                proxy_pass http://frontend_ui;
                break;
            }

            # 2. Browser navigation asking for HTML or React Server Components
            if ($http_accept ~* "(text/html|text/x-component)") {
                proxy_pass http://frontend_ui;
                break;
            }

            # 3. Explicit JSON or authenticated API requests always route to backend API
            if ($http_accept ~* "application/json") {
                proxy_pass http://backend_api;
                break;
            }
            if ($http_authorization ~* "^Bearer ") {
                proxy_pass http://backend_api;
                break;
            }

            # 4. Exact frontend page routes even if Accept header is */* or plain
            if ($uri ~* "^/(portal|discovery|workflows|publishers|outreach|crm|sales-intelligence|analytics|jobs|google-drive|social-connections|admin)(/?)$") {
                proxy_pass http://frontend_ui;
                break;
            }

            # 5. Frontend admin subpage routes
            if ($uri ~* "^/admin/(users|roles|scraper-infra|ai-control|seo|settings)(/?)$") {
                proxy_pass http://frontend_ui;
                break;
            }

            # 6. Frontend CRM subpage routes
            if ($uri ~* "^/crm/(pipeline|assistant|analytics|lists|import-export)(/?)$") {
                proxy_pass http://frontend_ui;
                break;
            }

            # Otherwise, forward API requests to backend
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Frontend Next.js Dashboard and pages
        location / {
            proxy_pass http://frontend_ui;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
