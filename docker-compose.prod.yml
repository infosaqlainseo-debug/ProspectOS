services:
  nginx:
    image: nginx:alpine
    container_name: prospectos_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backups/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - prospectos_public_net
      - prospectos_internal_net

  db:
    image: postgres:15
    container_name: prospectos_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-prospectos}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-prospectos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prospectos_internal_net

  redis:
    image: redis:7-alpine
    container_name: prospectos_redis_prod
    restart: always
    volumes:
      - redis_prod_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prospectos_internal_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prospectos_backend_prod
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-prospectos}
      - REDIS_URL=redis://redis:6379/0
      - EMAIL_PROVIDER=none
      - ENVIRONMENT=production
      - BACKUP_DIR=/app/backups
    volumes:
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers"]
    networks:
      - prospectos_internal_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prospectos_worker_prod
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-prospectos}
      - REDIS_URL=redis://redis:6379/0
      - EMAIL_PROVIDER=none
      - ENVIRONMENT=production
      - BACKUP_DIR=/app/backups
    volumes:
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["arq", "app.workers.worker.WorkerSettings"]
    networks:
      - prospectos_internal_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prospectos_frontend_prod
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${PROD_API_URL:-http://localhost}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - prospectos_internal_net

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  prospectos_public_net:
    driver: bridge
  prospectos_internal_net:
    driver: bridge
    internal: false
