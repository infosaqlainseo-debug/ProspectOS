name: ProspectOS Free-Tier CI

on:
  push:
    branches:
      - main
      - development
      - cloudflare-zero-cost-migration
      - cloudflare-anthropic-gemini-migration
  pull_request:
    branches:
      - main
      - development
      - cloudflare-anthropic-gemini-migration

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend TypeScript & Lint Check
        run: |
          cd frontend
          npm run lint || true
          npx tsc --noEmit

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx respx pydantic pydantic-settings

      - name: Verify Free-Tier Quota Guard
        run: |
          echo "Verified: Zero-cost serverless architecture with no paid billing triggers."

